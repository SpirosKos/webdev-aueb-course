<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Άσκηση 1</title>
</head>
<body>

<h1>Στοιχεία Εκπαδευομενου</h1>
    <form>
        <div>
            <label for="Επώνυμο">Επώνυμο:</label>
            <input type="text" name="Επώνυμο" id="Επώνυμο" size="20">
        </div>
        <div>
            <label for="Ονομα">Ονομα:</label>
            <input type="text" name="Ονομα" id="Ονομα" size="20">
        </div>
        <div>
            <label for="ΗμΓεννησης">Ημερομηνία Γέννησης:</label>
            <input type="date" placeholder="DD-MM-YYYY" size="20">
        </div>
        <div>
            <label for="Έτος Σπουδών">Έτος Σπουδών:</label>
            <input type="number" name="Έτος Σπουδών" id="Έτος Σπουδών" size="20">
        </div>
        <div>
            <label for="Email">Login(e-mail):</label>
            <input type="text" name="Email" id="Email" size="20">
        </div>
        <div>
            <label for="passwd">Password::</label>
            <input type="text" name="passwd" id="passwd" size="20">
        </div>
        <div>
            <input type="submit" value="Αποστολή">
        </div>
    </form>
</body>
</html>
