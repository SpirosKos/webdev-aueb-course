<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ασκηση 2</title>
</head>
<body>
    <h1> Φόρμα Πληρωμής</h1>
    <p>Τα υποχρεωτικά πεδία ακολοθούνται απο<abbr title="Required field"> *.</abbr></p>
    <h3>Προσωπικά  Στοιχεία</h3>
    <form>
        <fieldset style="width:250px;">
            <legend>Title</legend>
            <div>
                <input type="radio" name="Mr" id="Mr" size="100">
                <label for="Mr">Mr.</label><br>
                <input type="radio" name="Mrs" id="Mrs">
                <label for="Mr">Mrs.</label><br>
                <input type="radio" name="Dr" id="Dr">
                <label for="Dr">Dr.</label>
            </div>
        </fieldset>
        <div>
            <label for="name">Name<abbr title="Required field"> :*</abbr></label>
            <input type="text" name="Name" id="Name"><br>
            <label for="e-mail">Email<abbr title="Required field"> :*</abbr></label>
            <input type="email" name="email" id="email"><br>
            <label for="passwd">Password<abbr title="Required field"> :*</abbr></label>
            <input type="text" name="passwd" id="passwd"><br>
        <h3>Πληροφορίες Πληρωμης</h3>
            <label for="card">Card type:</label>
            <select name="cardtype" id="cardtype">
                <option value="1">Visa</option>
                <option value="2">Mastercard</option>
                <option value="3">Amex</option>
            </select><br>
            <label for="cardnumber">Card number<abbr title="Required field"> :*</abbr> </label>
            <input type="text" name="cardnumber" id="cardnumber"><br>
            <label for="expiration date">Expiration date<abbr title="Required field"> :*</abbr></label>
            <input type="month" id="expiration date" name="expiration date" placeholder="MM/YY"><br>
        </div>
        <div>
            <input type="submit" value="Προχωρήστε στην πληρωμή">
        </div>
        
    </form>
</body>
</html>
